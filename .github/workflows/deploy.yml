name: Deploy to Cloudflare

# Production deploys happen here, not on a hosting provider's build minutes.
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  — token with "Workers Scripts: Edit" and "Zone: DNS: Edit" (for custom domains)
#   CLOUDFLARE_ACCOUNT_ID — from the Cloudflare dashboard sidebar
# Optional: GOOGLE_SITE_VERIFICATION (baked into the build).
# The ANTHROPIC_API_KEY is a Worker secret set once with `npx wrangler secret put`, not a GitHub secret.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test
      - name: Build (OpenNext for Cloudflare)
        run: npm run build-kb && npx opennextjs-cloudflare build
        env:
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
      - name: Deploy
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
